version: '3.11'
services:
  postgres-db:
    container_name: postgres-db
    image: postgres:latest
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart:
      on-failure
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 3s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: redis
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: [ "server", "--console-address", ":9001", "/data" ]
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 3

  hospital-backend:
    container_name: hospital-backend
#    build:
#      context: ./back
#      dockerfile: Dockerfile
    image: hospital-backend:latest
    env_file:
      - .env
    ports:
      - "8082:8082"
    depends_on:
      postgres-db:
        condition: service_healthy
      minio:
        condition: service_healthy

  hospital-frontend:
    container_name: hospital-frontend
#    build:
#      context: ./front
#      dockerfile: Dockerfile
    image: hospital-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - hospital-backend

volumes:
  postgres-data:
  minio-data: